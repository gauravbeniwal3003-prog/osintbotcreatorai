services:
  - type: web
    name: osint-bot-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:10000
    envVars:
      - key: PORT
        value: 10000
    healthCheckPath: /health

  - type: worker
    name: osint-bot-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_worker.py
